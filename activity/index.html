<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Jellyfin Watch Party</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111318;
      color: white;
    }

    header {
      padding: 20px 24px;
      border-bottom: 1px solid #292c33;
      background: #15171c;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    #status {
      margin: 8px 0 0;
      color: #aeb4c0;
    }

    #movies {
      padding: 24px;
    }

    .movie {
      background: #1a1d23;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .movie:hover {
      transform: translateY(-3px);
    }

    .poster {
      width: 100%;
      aspect-ratio: 2 / 3;
      object-fit: cover;
      display: block;
      background: #242832;
    }

    .movie-info {
      padding: 12px;
    }

    .movie-title {
      font-weight: 600;
      line-height: 1.3;
    }

    .movie-year {
      margin-top: 5px;
      color: #aeb4c0;
      font-size: 14px;
    }

    .movie-details {
      max-width: 1000px;
      margin: auto;
    }

    .back-button {
      border: 0;
      background: #292d36;
      color: white;
      padding: 10px 16px;
      border-radius: 7px;
      cursor: pointer;
      margin-bottom: 24px;
    }

    .details-content {
      display: flex;
      gap: 30px;
    }

    .details-poster {
      width: 280px;
      max-width: 40%;
      height: fit-content;
      border-radius: 10px;
    }

    .details-information {
      flex: 1;
    }

    .details-information h1 {
      margin-top: 0;
      font-size: 32px;
    }

    .metadata {
      color: #aeb4c0;
      margin-bottom: 12px;
    }

    .genres {
      color: #c8ccd4;
      margin-bottom: 20px;
    }

    .overview {
      color: #d7dae0;
      line-height: 1.6;
    }

    .play-button {
      margin-top: 20px;
      padding: 12px 24px;
      border: 0;
      border-radius: 8px;
      background: white;
      color: #111318;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .player-container {
      max-width: 1200px;
      margin: auto;
    }

    .video-player {
      display: block;
      width: 100%;
      max-height: 75vh;
      background: black;
      border-radius: 8px;
    }

    .error {
      color: #ff7b7b;
    }

    @media (max-width: 600px) {
      .details-content {
        flex-direction: column;
      }

      .details-poster {
        max-width: 220px;
        width: 100%;
      }

      .details-information h1 {
        font-size: 25px;
      }

      #movies {
        padding: 16px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>Jellyfin Watch Party</h1>
    <p id="status">Loading...</p>
  </header>

  <main id="movies"></main>

  <script type="module" src="/src/main.js"></script>

</body>
</html>
